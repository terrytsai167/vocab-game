<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>字島大冒險 8-Bit - 勇者試煉之路</title>
  
  <!-- 載入 8-Bit 像素中英文字體：Press Start 2P (英文) + DotGothic16 (中文點陣) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Nunito:wght@700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    /* 全域點陣字體與像素渲染規則 */
    html, body {
      font-family: 'DotGothic16', monospace, sans-serif;
      overscroll-behavior-y: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      image-rendering: pixelated;
    }

    /* 英文專用復古街機字體 (用於分數、血條、數字等 UI 裝飾) */
    .pixel-en {
      font-family: 'Press Start 2P', 'DotGothic16', monospace;
      letter-spacing: 0.04em;
    }

    /* 兒童清晰閱讀英文字體 (圓潤無襯線，不切割單字，不因過寬折行) */
    .clear-word-font {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.02em;
    }

        /* 護眼沉穩 8-Bit 復古深藍灰網格背景（不搶戲、不花俏） */
    .pixel-forest-bg {
      background-color: #1e293b;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* 經典 RPG 雙層像素邊框與立體陰影 */
    .pixel-box {
      border: 4px solid #0f172a;
      box-shadow: 
        inset -4px -4px 0px rgba(0, 0, 0, 0.2),
        inset 4px 4px 0px rgba(255, 255, 255, 0.6),
        6px 6px 0px #0f172a;
    }

    .pixel-box-sm {
      border: 3px solid #0f172a;
      box-shadow: 
        inset -2px -2px 0px rgba(0, 0, 0, 0.15),
        inset 2px 2px 0px rgba(255, 255, 255, 0.6),
        3px 3px 0px #0f172a;
    }

    /* 8-Bit 街機立體按鈕 */
    .pixel-btn {
      border: 3px solid #0f172a;
      box-shadow: 
        inset -3px -3px 0px rgba(0, 0, 0, 0.25),
        inset 3px 3px 0px rgba(255, 255, 255, 0.55),
        3px 3px 0px #0f172a;
      transition: transform 0.05s;
    }
    .pixel-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 
        inset 2px 2px 0px rgba(0, 0, 0, 0.3),
        0px 0px 0px #0f172a;
    }

    .pixel-select, .pixel-input {
      border: 3px solid #0f172a;
      box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.15);
      border-radius: 0px;
    }

    /* 平板橫擺 (Landscape) 垂直空間自適應緊湊排版，避免上下按鈕被截斷 */
    @media (orientation: landscape) and (max-height: 900px) {
      .landscape-compact-shell {
        padding-top: 0.75rem !important;
        padding-bottom: 0.75rem !important;
      }
      .landscape-compact-card {
        padding-top: 0.75rem !important;
        padding-bottom: 0.75rem !important;
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-anim { animation: shake 0.4s ease-in-out; }

    @keyframes critFlash {
      0% { box-shadow: 0 0 0px rgba(250, 204, 21, 0); transform: scale(1); }
      20% { box-shadow: 0 0 40px 10px rgba(250, 204, 21, 0.95); transform: scale(1.02); }
      55% { box-shadow: 0 0 25px 6px rgba(245, 158, 11, 0.85); transform: scale(1.01); }
      100% { box-shadow: 0 0 0px rgba(250, 204, 21, 0); transform: scale(1); }
    }
    .crit-flash-anim { animation: critFlash 0.85s ease-out; }

    @keyframes screenGoldenBurst {
      0% { opacity: 0; }
      15% { opacity: 0.72; }
      40% { opacity: 0.35; }
      60% { opacity: 0.65; }
      100% { opacity: 0; }
    }
    .crit-screen-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.45) 0%, rgba(250, 204, 21, 0.85) 70%, rgba(234, 88, 12, 0.9) 100%);
      animation: screenGoldenBurst 0.95s ease-out forwards;
    }

    @keyframes comboPop {
      0% { transform: scale(0.6) rotate(-4deg); opacity: 0; }
      60% { transform: scale(1.15) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .combo-pop-anim { animation: comboPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .handwriting-canvas {
      touch-action: none !important;
      -webkit-user-drag: none;
      user-select: none;
      display: block;
      width: 100%;
    }
  </style>
</head>
<body class="pixel-forest-bg min-h-screen overflow-y-auto flex items-start sm:items-center justify-center p-2 sm:p-4 text-slate-900">

<div id="app" class="pixel-box bg-[#fffdf5] w-full max-w-4xl p-4 sm:p-6 landscape-compact-shell my-auto">
  <!-- 全螢幕會心一擊金光閃爍特效層 -->
  <div v-if="isCritHit" class="crit-screen-overlay flex items-center justify-center">
    <div class="combo-pop-anim pixel-box bg-amber-300 border-slate-950 px-6 py-3 text-center">
      <div class="pixel-en text-xl sm:text-3xl font-extrabold text-rose-600 drop-shadow">💥 CRITICAL HIT! 💥</div>
      <div class="text-sm sm:text-lg font-extrabold text-slate-950 mt-1">🔥 {{ comboCount }} 連擊！會心一擊 1.5x 暴擊傷害！</div>
    </div>
  </div>
  
  <!-- 勇者 RPG 身分狀態列 -->
  <profile-bar 
    :current-user="currentUser" 
    :users="users"
    :today-word-count="todayWordCount"
    :equipped-gear="equippedGear"
    :streak-title="streakTitle"
    :treasure-status="treasureStatus"
    :double-star-remaining-sec="doubleStarRemainingSec"
    @switch-user="switchUser"
    @open-profile-modal="showProfileModal = true"
    @open-shop-modal="showShopModal = true"
    @open-treasure-chest="openDailyTreasureChest"
  ></profile-bar>

  <!-- 頂部四大模式切換 -->
  <nav-bar :current-mode="currentMode" :stars="stars" @set-mode="setMode"></nav-bar>

  <!-- 單字本與課次雙層選單 -->
  <book-unit-selector
    v-if="currentMode !== 'translate'"  
    :book-list="visibleBookList"
    :selected-book-id="selectedBookId"
    :unit-list="unitList"
    :selected-unit="selectedUnit"
    :total-words="allRawWords.length"
    :wrong-words-count="currentBookWrongWordsCount"
    :saved-words-count="savedWordsCount"
    :current-mode="currentMode"
    :current-index="currentIndex"
    :current-word-count="wordList.length"
    @change-book="onBookChange"
    @change-unit="onUnitChange"
  ></book-unit-selector>

  <!-- 載入中畫面 -->
  <div v-if="isLoading" class="text-center py-16 text-slate-800 space-y-3">
    <div class="animate-bounce text-4xl">⏳</div>
    <p class="text-base font-bold">LOADING DATA...</p>
    <button @click="loadWords()" class="pixel-btn bg-white px-3 py-1 text-xs font-bold mt-2">RETRY</button>
  </div>

  <!-- 各關卡模式渲染 -->
  <template v-else>
    <study-mode 
      v-if="currentMode === 'study'"
      :word="currentWord"
      :current-rate="currentRate"
      :is-listening="isListening"
      :feedback="studyFeedback"
      :feedback-color="studyFeedbackColor"
      :wrong-count="currentWordWrongCount"
      :is-favorited="isCurrentWordFavorited"
      @toggle-favorite="toggleFavoriteWord"
      @set-rate="setRate"
      @speak="speak"
      @voice-challenge="startListeningStudy"
      @open-practice="showPracticeModal = true"
      @prev="prevWord"
      @next="nextWord"
    ></study-mode>

    <listen-trial 
      v-else-if="currentMode === 'trial_listen'"
      :word="currentTrialWord"
      :trial-index="trialIndex"
      :total-trials="trialList.length"
      :combo="comboCount"
      :feedback="trialFeedback"
      :feedback-color="trialFeedbackColor"
      @speak="speak"
      @check="checkListenAnswer"
    ></listen-trial>

    <spell-trial 
      v-else-if="currentMode === 'trial_spell'"
      :word="currentTrialWord"
      :trial-index="trialIndex"
      :total-trials="trialList.length"
      :combo="comboCount"
      :spelled-letters="spelledLetters"
      :scrambled-pool="scrambledPool"
      :feedback="trialFeedback"
      :feedback-color="trialFeedbackColor"
      @speak="speak"
      @pick-letter="pickLetter"
      @remove-letter="removeLetter"
      @reset="resetSpelling"
      @check="checkSpelling"
    ></spell-trial>

    <boss-battle 
      v-else-if="currentMode === 'boss'"
      :game-state="bossGameState"
      :boss-info="currentBossInfo"
      :boss-hp="bossHp"
      :player-hp="playerHp"
      :timer="timer"
      :max-timer="maxBossTime"
      :equipped-gear="equippedGear"
      :is-writing-active="isWritingActive"
      :question="currentBossQuestion"
      :question-index="bossQuestionIndex"
      :total-questions="bossQuizList.length"
      :masked-sentence="maskedSentence"
      :typed-word="bossTypedWord"
      :is-recognizing="isRecognizing"
      :last-recognized-letter="lastRecognizedLetter"
      :combat-msg="combatMsg"
      :combat-msg-color="combatMsgColor"
      :is-shaking="isShaking"
      :is-listening="isListening"
      @add-space="addSpaceToBossWord"
      @backspace="backspaceBossWord"
      @clear="clearBossWord"
      @submit="submitBossAnswer"
      @voice-attack="startBossVoiceAttack"
      @restart="startBossBattle"
      @writing-start="onWritingStart"
      @writing-end="onWritingEnd"
      @update-typed-word="onUpdateTypedWord"
    ></boss-battle>

    <translate-tool
      v-else-if="currentMode === 'translate'"
      :saved-words="currentUser.savedWords || []"
      :treasure-task="currentUser.treasureHuntTask"
      @speak="speak"
      @toggle-favorite="toggleFavoriteWord"
      @set-treasure-task="setTreasureTask"
      @complete-treasure-task="completeTreasureTask"
      @clear-treasure-task="clearTreasureTask"
    ></translate-tool>
  </template>

  <!-- 學習歷程與課本指定彈窗 -->
  <user-profile-modal
    :show="showProfileModal"
    :current-user="currentUser"
    :users="users"
    :today-word-count="todayWordCount"
    :all-available-books="allAvailableBooks"
    @close="showProfileModal = false"
    @save-user-settings="onSaveUserSettings"
    @add-user="onAddUser"
    @delete-user="onDeleteUser"
    @start-weakness-training="startWeaknessTraining"
    @clear-wrong-words="clearWrongWords"
    @start-saved-training="startSavedTraining"
    @add-saved-word="addSavedWord"
    @update-saved-word="updateSavedWord"
    @remove-saved-word="removeSavedWord"
  ></user-profile-modal>

  <!-- 🎁 每日勇者寶箱開啟驚喜彈窗 -->
  <div v-if="treasureChestPopup" class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
    <div class="combo-pop-anim pixel-box bg-[#fffbeb] w-full max-w-md p-6 text-center space-y-3 text-slate-900">
      <div class="text-5xl animate-bounce">🎁 ✨ 💰</div>
      <h2 class="text-xl font-extrabold text-amber-700">今日勇者寶箱開啟！</h2>
      <div class="pixel-box-sm bg-amber-200 p-3 text-base sm:text-lg font-extrabold text-rose-700">
        {{ treasureChestPopup.title }}
      </div>
      <p class="text-xs sm:text-sm font-bold text-slate-700">{{ treasureChestPopup.desc }}</p>
      <button @click="treasureChestPopup = null" type="button"
              class="pixel-btn w-full bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold py-2.5 text-sm">
        太棒了！繼續冒險 ➔
      </button>
    </div>
  </div>

  <!-- 勇者裝備屋與寵物扭蛋機彈窗 -->
  <hero-shop-modal
    :show="showShopModal"
    :current-user="currentUser"
    @close="showShopModal = false"
    @buy-item="onBuyItem"
    @equip-item="onEquipItem"
    @roll-gacha="onRollGacha"
  ></hero-shop-modal>

  <!-- 單字默寫特訓彈窗 (5~10次) -->
  <word-practice-modal
    :show="showPracticeModal"
    :word="currentWord"
    :current-index="currentIndex"
    :total-words="wordList.length"
    @next-word="nextPracticeWord"
    @close="showPracticeModal = false"
    @speak="speak"
    @practice-complete="onPracticeComplete"
    @practice-error="onPracticeError"
  ></word-practice-modal>

</div>

<!-- 版本號 v=8bit_1 強制穿透快取 -->
<script src="./js/config.js?v=8bit_wide_v15"></script>
<script src="./js/services.js?v=8bit_wide_v15"></script>
<script src="./js/components.js?v=8bit_wide_v15"></script>
<script src="./js/app.js?v=8bit_wide_v15"></script>
</body>
</html>
