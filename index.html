<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>字島大冒險 8-Bit - 勇者試煉之路</title>
  
  <!-- 載入 8-Bit 像素中英文字體：Press Start 2P (英文) + DotGothic16 (中文點陣) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    /* 全域點陣字體與像素渲染規則 */
    html, body {
      font-family: 'DotGothic16', monospace, sans-serif;
      overscroll-behavior-y: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      image-rendering: pixelated;
    }

    /* 英文專用復古街機字體 */
    .pixel-en {
      font-family: 'Press Start 2P', 'DotGothic16', monospace;
      letter-spacing: 0.04em;
    }

        /* 護眼沉穩 8-Bit 復古深藍灰網格背景（不搶戲、不花俏） */
    .pixel-forest-bg {
      background-color: #1e293b;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* 經典 RPG 雙層像素邊框與立體陰影 */
    .pixel-box {
      border: 4px solid #0f172a;
      box-shadow: 
        inset -4px -4px 0px rgba(0, 0, 0, 0.2),
        inset 4px 4px 0px rgba(255, 255, 255, 0.6),
        6px 6px 0px #0f172a;
    }

    .pixel-box-sm {
      border: 3px solid #0f172a;
      box-shadow: 
        inset -2px -2px 0px rgba(0, 0, 0, 0.15),
        inset 2px 2px 0px rgba(255, 255, 255, 0.6),
        3px 3px 0px #0f172a;
    }

    /* 8-Bit 街機立體按鈕 */
    .pixel-btn {
      border: 3px solid #0f172a;
      box-shadow: 
        inset -3px -3px 0px rgba(0, 0, 0, 0.25),
        inset 3px 3px 0px rgba(255, 255, 255, 0.55),
        3px 3px 0px #0f172a;
      transition: transform 0.05s;
    }
    .pixel-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 
        inset 2px 2px 0px rgba(0, 0, 0, 0.3),
        0px 0px 0px #0f172a;
    }

    .pixel-select, .pixel-input {
      border: 3px solid #0f172a;
      box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.15);
      border-radius: 0px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-anim { animation: shake 0.4s ease-in-out; }

    .handwriting-canvas {
      touch-action: none !important;
      -webkit-user-drag: none;
      user-select: none;
      display: block;
      width: 100%;
    }
  </style>
</head>
<body class="pixel-forest-bg min-h-screen flex items-center justify-center p-2 sm:p-4 text-slate-900">

<div id="app" class="pixel-box bg-[#fffdf5] w-full max-w-2xl p-4 sm:p-7">
  
  <!-- 勇者 RPG 身分狀態列 -->
  <profile-bar 
    :current-user="currentUser" 
    :users="users"
    @switch-user="switchUser"
    @open-profile-modal="showProfileModal = true"
  ></profile-bar>

  <!-- 頂部四大模式切換 -->
  <nav-bar :current-mode="currentMode" :stars="stars" @set-mode="setMode"></nav-bar>

  <!-- 單字本與課次雙層選單 -->
  <book-unit-selector 
    :book-list="visibleBookList"
    :selected-book-id="selectedBookId"
    :unit-list="unitList"
    :selected-unit="selectedUnit"
    :total-words="allRawWords.length"
    :current-mode="currentMode"
    :current-index="currentIndex"
    :current-word-count="wordList.length"
    @change-book="onBookChange"
    @change-unit="onUnitChange"
  ></book-unit-selector>

  <!-- 載入中畫面 -->
  <div v-if="isLoading" class="text-center py-16 text-slate-800 space-y-3">
    <div class="animate-bounce text-4xl">⏳</div>
    <p class="text-base font-bold">LOADING DATA...</p>
    <button @click="loadWords()" class="pixel-btn bg-white px-3 py-1 text-xs font-bold mt-2">RETRY</button>
  </div>

  <!-- 各關卡模式渲染 -->
  <template v-else>
    <study-mode 
      v-if="currentMode === 'study'"
      :word="currentWord"
      :current-rate="currentRate"
      :is-listening="isListening"
      :feedback="studyFeedback"
      :feedback-color="studyFeedbackColor"
      @set-rate="setRate"
      @speak="speak"
      @voice-challenge="startListeningStudy"
      @open-practice="showPracticeModal = true"
      @next="nextWord"
    ></study-mode>

    <listen-trial 
      v-else-if="currentMode === 'trial_listen'"
      :word="currentTrialWord"
      :trial-index="trialIndex"
      :total-trials="trialList.length"
      :feedback="trialFeedback"
      :feedback-color="trialFeedbackColor"
      @speak="speak"
      @check="checkListenAnswer"
    ></listen-trial>

    <spell-trial 
      v-else-if="currentMode === 'trial_spell'"
      :word="currentTrialWord"
      :trial-index="trialIndex"
      :total-trials="trialList.length"
      :spelled-letters="spelledLetters"
      :scrambled-pool="scrambledPool"
      :feedback="trialFeedback"
      :feedback-color="trialFeedbackColor"
      @speak="speak"
      @pick-letter="pickLetter"
      @remove-letter="removeLetter"
      @reset="resetSpelling"
      @check="checkSpelling"
    ></spell-trial>

    <boss-battle 
      v-else-if="currentMode === 'boss'"
      :game-state="bossGameState"
      :boss-hp="bossHp"
      :player-hp="playerHp"
      :timer="timer"
      :is-writing-active="isWritingActive"
      :question="currentBossQuestion"
      :question-index="bossQuestionIndex"
      :total-questions="bossQuizList.length"
      :masked-sentence="maskedSentence"
      :typed-word="bossTypedWord"
      :is-recognizing="isRecognizing"
      :last-recognized-letter="lastRecognizedLetter"
      :combat-msg="combatMsg"
      :combat-msg-color="combatMsgColor"
      :is-shaking="isShaking"
      :is-listening="isListening"
      @add-space="addSpaceToBossWord"
      @backspace="backspaceBossWord"
      @clear="clearBossWord"
      @submit="submitBossAnswer"
      @voice-attack="startBossVoiceAttack"
      @restart="startBossBattle"
      @writing-start="onWritingStart"
      @writing-end="onWritingEnd"
      @update-typed-word="onUpdateTypedWord"
    ></boss-battle>
  </template>

  <!-- 學習歷程與課本指定彈窗 -->
  <user-profile-modal
    :show="showProfileModal"
    :current-user="currentUser"
    :users="users"
    :all-available-books="allAvailableBooks"
    @close="showProfileModal = false"
    @save-user-settings="onSaveUserSettings"
    @add-user="onAddUser"
    @delete-user="onDeleteUser"
  ></user-profile-modal>

  <!-- 單字默寫特訓彈窗 (5~10次) -->
  <word-practice-modal
    :show="showPracticeModal"
    :word="currentWord"
    @close="showPracticeModal = false"
    @speak="speak"
    @practice-complete="onPracticeComplete"
  ></word-practice-modal>

</div>

<!-- 版本號 v=8bit_1 強制穿透快取 -->
<script src="./js/config.js?v=8bit_2"></script>
<script src="./js/services.js?v=8bit_2"></script>
<script src="./js/components.js?v=8bit_2"></script>
<script src="./js/app.js?v=8bit_2"></script>
</body>
</html>
